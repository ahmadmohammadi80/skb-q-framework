name: Real SmolLM2 norm-certified QK allocation
on:
  push:
    branches:
      - research/2026-11-24-norm-certified-rope
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-score-and-allocate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned model/scoring dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.49.0' 'huggingface-hub==0.36.2' 'numpy>=1.26,<3' safetensors sentencepiece
      - name: Score real pinned model weights without test/calibration tokens
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python reproduction/certified_rope_20261124/run_certified.py --output-dir certified_real_model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certified-real-smollm2-allocation
          path: certified_real_model/
          if-no-files-found: warn
