name: Validate norm-certified RoPE candidate
on:
  push:
    branches:
      - research/2026-11-24-norm-certified-rope
  pull_request:
permissions:
  contents: read
jobs:
  certificate-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric and test dependencies
        run: |
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test certified algorithm and mathematical controls
        run: python -m pytest -q reproduction/certified_rope_20261124/tests
