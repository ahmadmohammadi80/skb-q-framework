[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skb-q-framework"
version = "0.1.0"
description = "Research framework for Structural Knowledge Bridge quantization experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "SKB-Q Contributors" }
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
